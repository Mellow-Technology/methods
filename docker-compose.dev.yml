# Optional services for trying object storage and OIDC locally.
# Postgres is expected to run on the host (see README).
#
#   docker compose -f docker-compose.dev.yml up -d
#   curl -X PUT http://127.0.0.1:8333/methods      # create the bucket
#
# Then in server/.env:
#   S3_BUCKET=methods  S3_ENDPOINT=http://127.0.0.1:8333  S3_ALLOW_HTTP=true
#   S3_ACCESS_KEY_ID=any  S3_SECRET_ACCESS_KEY=any
#   OIDC_ISSUER=http://localhost:8090/default  OIDC_CLIENT_ID=methods
#   OIDC_CLIENT_SECRET=secret  OIDC_NAME="Mock SSO"

services:
  # S3-compatible object storage (no auth configured: dev only).
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3
    ports:
      - "8333:8333"

  # A mock OpenID Connect provider that signs in a fixed test user.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8090:8080"
    environment:
      JSON_CONFIG: >-
        {"interactiveLogin": false, "tokenCallbacks": [{"issuerId": "default", "tokenExpiry": 3600,
        "requestMappings": [{"requestParam": "grant_type", "match": "*", "claims": {
        "sub": "oidc-user-1", "aud": ["methods"], "email": "olive@example.com", "email_verified": true,
        "given_name": "Olive", "family_name": "Dee", "preferred_username": "olive"}}]}]}
